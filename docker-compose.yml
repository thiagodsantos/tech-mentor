services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_mentor}
      POSTGRES_USER: ${POSTGRES_USER:-tech_mentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute make setup para gerar as credenciais locais}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tech_mentor} -d ${POSTGRES_DB:-tech_mentor}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tech_mentor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tech_mentor}
      FERNET_KEY: ${FERNET_KEY:?Execute make setup para gerar a chave de criptografia}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CREDITS_POLL_INTERVAL_SECONDS: ${CREDITS_POLL_INTERVAL_SECONDS:-300}
      MINIMUM_CREDITS_POLL_INTERVAL_SECONDS: ${MINIMUM_CREDITS_POLL_INTERVAL_SECONDS:-60}
      MODELS_CACHE_TTL_SECONDS: ${MODELS_CACHE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
