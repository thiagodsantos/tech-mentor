[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-mentor-backend"
version = "0.1.0"
description = "FastAPI backend for the Tech Mentor MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3.6,<1",
  "cryptography>=43,<52",
  "httpx>=0.27,<1",
  "langgraph>=0.2.60,<1",
  "langchain-openai>=0.2.10,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
